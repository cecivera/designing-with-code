<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Directorio de equipo</title>
<style>
  /* Layout: cabecera con buscador, lista en dos columnas que pasa a una en móvil */
  :root{
    --bg:#f3f5f7; --surface:#ffffff; --fg:#17202a; --muted:#5d6b78; --line:#dde2e7;
    --accent:#0f6b5c; --accent-soft:#dff1ed; --focus:#0f6b5c;
    --font-display:ui-sans-serif,'Segoe UI',system-ui,-apple-system,sans-serif;
    --font-body:ui-sans-serif,'Segoe UI',system-ui,-apple-system,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#10171c; --surface:#18222a; --fg:#e8eef2; --muted:#93a3b0; --line:#2a3944;
      --accent:#5ecbb6; --accent-soft:#1c3a35; --focus:#5ecbb6; color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#10171c; --surface:#18222a; --fg:#e8eef2; --muted:#93a3b0; --line:#2a3944;
    --accent:#5ecbb6; --accent-soft:#1c3a35; --focus:#5ecbb6; color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{
    background:var(--bg); color:var(--fg); font-family:var(--font-body);
    font-size:15px; line-height:1.5;
    padding-block:48px 72px;
    padding-left:max(16px, env(safe-area-inset-left, 0px));
    padding-right:max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap{max-width:880px; margin:0 auto}
  header{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:28px}
  h1{font-family:var(--font-display); font-weight:700; font-size:clamp(28px,5vw,40px); line-height:1.1; letter-spacing:-0.02em; margin:0; text-wrap:balance}
  .count{color:var(--muted); margin:6px 0 0}
  .search{flex:1 1 240px; max-width:340px}
  .search label{display:block; font-size:12px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted); margin-bottom:6px}
  .search input{
    width:100%; font:inherit; color:var(--fg); background:var(--surface);
    border:1px solid var(--line); border-radius:8px; padding:10px 12px;
  }
  .search input:focus-visible{outline:2px solid var(--focus); outline-offset:1px}
  ul{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
  @media (max-width:640px){ ul{grid-template-columns:minmax(0,1fr)} }
  li{display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; min-width:0}
  li img{width:56px; height:56px; border-radius:50%; flex:none; background:var(--accent-soft); display:block}
  .info{min-width:0}
  .name{font-family:var(--font-display); font-weight:600; font-size:17px; line-height:1.25; overflow-wrap:anywhere}
  .role{color:var(--muted); font-size:14px}
  .tag{display:inline-block; margin-top:6px; font-size:12px; font-weight:500; color:var(--accent); background:var(--accent-soft); border-radius:999px; padding:2px 10px}
  .empty{color:var(--muted); padding:32px 0; text-align:center}
  .note{margin-top:28px; font-size:13px; color:var(--muted)}
  .note code{font-size:12px; overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Directorio de equipo</h1>
      <p class="count" id="count" aria-live="polite"></p>
    </div>
    <div class="search">
      <label for="q">Buscar</label>
      <input id="q" type="search" placeholder="Nombre, rol o equipo" autocomplete="off">
    </div>
  </header>

  <ul id="list"></ul>
  <p class="empty" id="empty" hidden>Nadie coincide con esa búsqueda.</p>

  <p class="note">Avatares generados con <a href="https://robohash.org/" target="_blank" rel="noopener" style="color:var(--accent)">RoboHash</a>: cada nombre da siempre el mismo robot.</p>
</div>

<script>
  var PEOPLE = [
    {name:'Lucía Fernández', role:'Product Designer', team:'Wholesale'},
    {name:'Martín Giménez', role:'UX Researcher', team:'Investigación'},
    {name:'Carla Ortega', role:'Product Owner', team:'Wholesale'},
    {name:'Diego Salvatierra', role:'Frontend Engineer', team:'Design System'},
    {name:'Inés Navarro', role:'Content Designer', team:'Experiencia de cliente'},
    {name:'Tomás Aguirre', role:'Salesforce Developer', team:'Plataforma'},
    {name:'Valentina Roig', role:'UX/UI Designer', team:'Design System'},
    {name:'Nicolás Paredes', role:'QA Engineer', team:'Plataforma'},
    {name:'Sofía Beltrán', role:'Project Manager', team:'Wholesale'},
    {name:'Julián Mercado', role:'Data Analyst', team:'Insights'}
  ];
  var COLORS = ['0f6b5c','1d4e89','8a3b5d','b45f06','5b4b9a','2f6f3e','a23b2a','356b7a'];

  function initials(n){
    var p = n.trim().split(/\s+/);
    return (p[0][0] + (p.length > 1 ? p[p.length-1][0] : '')).toUpperCase();
  }
  function colorFor(i){ return COLORS[i % COLORS.length]; }
  function apiUrl(name, bg){
    return 'https://robohash.org/' + encodeURIComponent(name) + '.png?size=128x128&set=set1';
  }
  // Robot dibujado en local a partir del nombre, por si la imagen remota no carga
  function hash(s){ var h = 2166136261; for (var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function fallback(name, bg){
    var h = hash(name), eye = h % 3, mouth = (h >> 3) % 3, ant = (h >> 6) % 2;
    var eyes = eye === 0 ? '<circle cx="48" cy="62" r="10" fill="#fff"/><circle cx="80" cy="62" r="10" fill="#fff"/><circle cx="48" cy="62" r="4" fill="#17202a"/><circle cx="80" cy="62" r="4" fill="#17202a"/>'
      : eye === 1 ? '<rect x="34" y="53" width="26" height="16" rx="3" fill="#fff"/><rect x="68" y="53" width="26" height="16" rx="3" fill="#fff"/><rect x="43" y="57" width="8" height="8" fill="#17202a"/><rect x="77" y="57" width="8" height="8" fill="#17202a"/>'
      : '<rect x="34" y="57" width="60" height="12" rx="6" fill="#fff"/><rect x="58" y="59" width="12" height="8" rx="4" fill="#17202a"/>';
    var mouths = mouth === 0 ? '<rect x="46" y="86" width="36" height="10" rx="2" fill="#fff"/><path d="M55 86v10M64 86v10M73 86v10" stroke="#17202a" stroke-width="2"/>'
      : mouth === 1 ? '<path d="M44 87q20 14 40 0" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>'
      : '<rect x="52" y="86" width="24" height="10" rx="5" fill="#fff"/>';
    var antenna = ant ? '<path d="M64 32V16" stroke="#17202a" stroke-width="4"/><circle cx="64" cy="13" r="6" fill="#fff"/>'
      : '<path d="M44 34L36 18M84 34L92 18" stroke="#17202a" stroke-width="4"/><circle cx="35" cy="15" r="5" fill="#fff"/><circle cx="93" cy="15" r="5" fill="#fff"/>';
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">' +
      '<rect width="128" height="128" fill="#' + bg + '"/>' + antenna +
      '<rect x="24" y="32" width="80" height="80" rx="16" fill="#17202a" fill-opacity="0.35"/>' +
      eyes + mouths + '</svg>';
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }

  var list = document.getElementById('list');
  var count = document.getElementById('count');
  var empty = document.getElementById('empty');
  var q = document.getElementById('q');

  function render(filter){
    var f = (filter || '').toLowerCase();
    list.innerHTML = '';
    var shown = 0;
    PEOPLE.forEach(function(p, i){
      var hay = (p.name + ' ' + p.role + ' ' + p.team).toLowerCase();
      if (f && hay.indexOf(f) === -1) return;
      shown++;
      var bg = colorFor(i);
      var li = document.createElement('li');
      var img = document.createElement('img');
      img.alt = 'Avatar de ' + p.name;
      img.width = 56; img.height = 56;
      img.loading = 'lazy';
      img.onerror = function(){ img.onerror = null; img.src = fallback(p.name, bg); };
      img.src = apiUrl(p.name, bg);
      var info = document.createElement('div');
      info.className = 'info';
      info.innerHTML = '<div class="name"></div><div class="role"></div><span class="tag"></span>';
      info.querySelector('.name').textContent = p.name;
      info.querySelector('.role').textContent = p.role;
      info.querySelector('.tag').textContent = p.team;
      li.appendChild(img); li.appendChild(info);
      list.appendChild(li);
    });
    count.textContent = shown + (shown === 1 ? ' persona' : ' personas');
    empty.hidden = shown !== 0;
  }
  q.addEventListener('input', function(){ render(q.value); });
  render('');
</script>
</body>
</html>
